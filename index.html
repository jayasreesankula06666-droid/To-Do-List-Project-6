<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">STUDENT PRODUCTIVITY</p>
      <h1>My To-Do List 📝</h1>
      <p class="subtitle">Plan your day, one task at a time.</p>
    </header>

    <form id="task-form" class="task-form">
      <label class="sr-only" for="task-input">New task</label>
      <input id="task-input" type="text" placeholder="Enter a task..." maxlength="160" required>
      <button type="submit">Add task</button>
    </form>

    <section class="summary" aria-live="polite">
      <span id="task-count">0 tasks</span>
      <span id="completed-count">0 completed</span>
    </section>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-message" class="empty">✨ No tasks yet. Add your first task above!</p>
    <footer>Made with HTML, CSS & JavaScript</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
